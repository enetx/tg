name: Cancel old builds

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cancel-old-builds.yml

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
    - name: Cancel the two superseded builds
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        for run_id in 41317811128 41317810882; do
          status=$(gh run view "$run_id" --repo "$GH_REPO" --json status --jq '.status')
          if [ "$status" != "completed" ]; then
            gh run cancel "$run_id" --repo "$GH_REPO"
          fi
        done

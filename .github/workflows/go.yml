name: Go

on: [ push, pull_request ]
jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.27.x'
        check-latest: true
        cache: true
    - name: Get dependencies
      run: go mod download
    - name: Verify dependencies
      run: go mod verify
    - name: Build examples
      run: |
        find examples -type f -name '*.go' -print0 | while IFS= read -r -d '' example; do
          go build -o /dev/null "$example"
        done
    - name: Test
      run: go test -race -v -coverprofile=profile.cov -coverpkg=./... ./tests/...
    - uses: shogo82148/actions-goveralls@v1
      with:
        path-to-profile: profile.cov

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag --latest
